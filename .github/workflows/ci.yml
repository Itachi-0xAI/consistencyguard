name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-all-MiniLM-L6-v2
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Warm up embedding model (download + cache)
        run: |
          python - <<'EOF'
          import time, os
          for attempt in range(5):
              try:
                  from sentence_transformers import SentenceTransformer
                  SentenceTransformer("all-MiniLM-L6-v2")
                  print("Model ready.")
                  break
              except Exception as e:
                  print(f"Attempt {attempt+1}/5 failed: {e}")
                  time.sleep(30)
          else:
              raise RuntimeError("Could not download model after 5 attempts")
          EOF

      - name: Run tests
        env:
          TRANSFORMERS_OFFLINE: "1"
          HF_DATASETS_OFFLINE: "1"
        run: pytest tests/ -v --tb=short

      - name: Run demo (zero-API-key check)
        env:
          TRANSFORMERS_OFFLINE: "1"
        run: python demo/run_demo.py
